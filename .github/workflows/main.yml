name: Build Soccer Stars Analyzer APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python setup
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. System dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            libsqlite3-dev \
            sqlite3 \
            bzip2 \
            libbz2-dev \
            liblzma-dev \
            libgdbm-dev \
            libnss3-dev \
            libreadline-dev \
            tk-dev \
            uuid-dev \
            libmpdec-dev

      # 4. Java Setup
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 5. Buildozer & dependencies
      - name: Install Buildozer and Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --user --upgrade buildozer cython virtualenv
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 6. Cache Buildozer downloads
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # 7. Build the APK
      - name: Build debug APK
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
        run: |
          export PATH=$PATH:~/.local/bin
          buildozer -v android debug 2>&1 | tee buildozer_build.log

      # 8. Upload APK artifact
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: soccer-stars-analyzer-debug-apk
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: error

      # 9. Upload build log on failure
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-failure-log
          path: buildozer_build.log
